<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register Police Officer | TrafficDesk</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">🚦</span>TrafficDesk</a><nav><a href="police-login.html">Police login</a><a href="user.html">Check challan</a></nav></header><main class="auth-shell"><section class="auth-card"><div class="eyebrow">Police registration</div><h2>Create officer account</h2><p>Use the project Police ID format: <strong>TS-POL-1234</strong>.</p><form id="registerForm"><label for="fullName">Full name</label><input id="fullName" required maxlength="100" placeholder="Your full name"><div class="form-grid"><div><label for="badgeNumber">Police ID</label><input id="badgeNumber" required placeholder="TS-POL-1234" maxlength="20"></div><div><label for="stationName">Station name</label><input id="stationName" required placeholder="e.g. Banjara Hills"></div></div><label for="email">Email address</label><input id="email" required type="email" placeholder="officer@example.com"><label for="password">Password</label><input id="password" required type="password" minlength="8" placeholder="At least 8 characters"><button type="submit">Create police account</button></form><div id="notice" class="notice"></div><p class="footer-note">Already registered? <a href="police-login.html"><strong>Log in</strong></a></p></section></main><script src="app.js"></script><script src="auth.js"></script></body></html>
